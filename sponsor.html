<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Commons: Host door retired</title>
<meta http-equiv="refresh" content="6; url=/index.html#host">
<style>
  :root{--bg:#F7F8F9;--ink:#0B0E14;--blue:#2F6DF6;--line:#D1D2D4;--mut:#5A6272}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,"Helvetica Neue",Arial,sans-serif;
       display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{max-width:560px;margin:24px;border:1px solid var(--line);padding:36px 34px;background:#fff}
  .kicker{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
          font-size:11px;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
  h1{font-size:26px;line-height:1.2;margin:14px 0 12px;font-weight:650}
  p{font-size:15px;line-height:1.55;color:var(--mut);margin:0 0 14px}
  a.btn{display:inline-block;margin-top:8px;border:1px solid var(--blue);color:var(--blue);
        padding:10px 16px;text-decoration:none;font-size:14px}
  a.btn:hover{background:var(--blue);color:#fff}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
</style>
</head>
<body>
  <main class="card">
    <div class="kicker">The Commons · Host</div>
    <h1>This host door is retired.</h1>
    <p>It signed host actions against an earlier contract, which is
       history. There is exactly one live host door now: the Host
       screen of the observatory.</p>
    <p>You are being redirected there. If nothing happens, use the button.</p>
    <a class="btn" href="/index.html#host">Open the host screen</a>
  </main>
</body>
</html>
